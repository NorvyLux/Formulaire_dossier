<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="lecture-url" content="">
<title>NC Advocat – ouverture de dossier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --fond:#F0F0F1; --feuille:#FFFFFF; --encre:#2B2B2D; --doux:#5F6066; --trait:#D0D1D5;
  --sceau:#D42F42; --sceau-fond:#FCEBED; --ok:#2E6B4F; --ok-fond:#E6F1EB; --champ:#F7F7F8;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fond:#0F1624; --feuille:#182236; --encre:#E8ECF3; --doux:#9AA6BC; --trait:#33405A;
  --sceau:#F0707C; --sceau-fond:#3A1F24; --ok:#7CC7A2; --ok-fond:#1B3329; --champ:#111A2B;}}
:root[data-theme="dark"]{
  --fond:#0F1624; --feuille:#182236; --encre:#E8ECF3; --doux:#9AA6BC; --trait:#33405A;
  --sceau:#F0707C; --sceau-fond:#3A1F24; --ok:#7CC7A2; --ok-fond:#1B3329; --champ:#111A2B;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sceau);outline-offset:2px}
header.barre{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;color:#373736;border-bottom:1px solid #D0D1D5;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding:.6rem 1rem}
.barre strong{font-family:var(--serif);font-weight:500;font-size:1.15rem}
.barre small{opacity:.75;margin-left:.5rem}
.barre>div:first-child{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.logo{height:26px;width:auto;display:block}
.convention .logo{height:46px;background:#fff;padding:8px 12px;border-radius:3px;margin-bottom:1.4rem}
.convention table{font-family:var(--sans);font-size:.82rem;line-height:1.4;min-width:640px}
.convention td,.convention th{white-space:normal;vertical-align:top}
.bascule{display:flex;border:1px solid #9A9A9D;border-radius:999px;overflow:hidden}
.bascule button{background:none;border:0;color:inherit;padding:.5rem 1rem;min-height:44px;cursor:pointer}
.bascule button[aria-pressed="true"]{background:#373736;color:#fff;font-weight:600}
main{max-width:1080px;margin:0 auto;padding:1.25rem 1rem 4rem}
.client{display:grid;grid-template-columns:220px 1fr;gap:1.5rem;align-items:start}
ol.etapes{list-style:none;margin:0;padding:0;counter-reset:e;position:sticky;top:5rem}
ol.etapes li{counter-increment:e;display:flex;gap:.7rem;align-items:center;padding:.55rem 0;color:var(--doux)}
ol.etapes li::before{content:counter(e);flex:none;width:1.9rem;height:1.9rem;border-radius:50%;border:1.5px solid var(--trait);display:grid;place-items:center;font-size:.85rem;font-weight:600}
ol.etapes li.fait::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--feuille)}
ol.etapes li.ici{color:var(--encre);font-weight:600}
ol.etapes li.ici::before{background:var(--sceau);border-color:var(--sceau);color:var(--feuille)}
.feuille{background:var(--feuille);border:1px solid var(--trait);border-top:5px solid var(--sceau);border-radius:3px;padding:clamp(1.25rem,4vw,2.75rem);min-width:0}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.15;margin:0 0 .4rem}
h2{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:1.75rem 0 .6rem}
h3{font-size:1rem;margin:1.2rem 0 .3rem}
p.intro{color:var(--doux);max-width:62ch;margin:.2rem 0 1.4rem}
.choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}
.choix button{text-align:left;background:var(--champ);border:1.5px solid var(--trait);border-radius:4px;padding:1rem;min-height:76px;cursor:pointer}
.choix button[aria-pressed="true"]{border-color:var(--sceau);background:var(--sceau-fond)}
.choix b{display:block;font-family:var(--serif);font-weight:500;font-size:1.15rem}
.choix span{color:var(--doux);font-size:.9rem}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.grille .large{grid-column:1/-1}
.grille .coche{margin:.6rem 0 0}
.grille h3{margin:.9rem 0 0;font-family:var(--serif);font-weight:600;font-size:1.12rem;border-bottom:1px solid var(--trait);padding-bottom:.3rem}
label.ch{display:block;font-size:.92rem;font-weight:500}
label.ch em{color:var(--sceau);font-style:normal}
.ch input,.ch select,.ch textarea,.adm input[type=text],.adm select,.adm textarea{display:block;width:100%;margin-top:.3rem;background:var(--champ);border:1.5px solid var(--trait);border-radius:4px;padding:.7rem .75rem;min-height:48px}
.ch textarea{min-height:110px;resize:vertical}
.ch.err input,.ch.err select,.ch.err textarea{border-color:var(--sceau)}
.piece{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;border:1.5px dashed var(--trait);border-radius:4px;padding:1rem;margin-bottom:.75rem}
.piece.ok{border-style:solid;border-color:var(--ok);background:var(--ok-fond)}
.piece small{display:block;color:var(--doux)}
.piece input{position:absolute;opacity:0;width:1px;height:1px}
.ch.auto input,.ch.auto select,.ch.auto textarea{border-color:var(--ok);background:var(--ok-fond)}
.ch small{display:block;color:var(--ok);font-weight:400;margin-top:.2rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#zoneLecture{margin:1rem 0 .5rem}#zoneLecture .note{margin:.6rem 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.6rem 1.2rem;border-radius:4px;border:1.5px solid var(--encre);background:none;cursor:pointer;font-weight:600}
.btn.plein{background:var(--encre);color:var(--feuille)}
.btn.sceau{background:var(--sceau);border-color:var(--sceau);color:var(--feuille)}
.btn.petit{min-height:38px;padding:.3rem .7rem;font-weight:500;font-size:.9rem;border-color:var(--trait)}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--trait)}
.alerte{background:var(--sceau-fond);border-left:4px solid var(--sceau);padding:.75rem 1rem;margin-top:1rem;border-radius:2px}
.note{background:var(--champ);border:1px solid var(--trait);padding:.75rem 1rem;border-radius:4px;font-size:.92rem;color:var(--doux)}
.convention{font-family:var(--serif);font-size:1.08rem;line-height:1.65;max-width:68ch}
.convention h3{font-family:var(--serif);font-weight:600;font-size:1.1rem}
.convention .parties{border-block:1px solid var(--trait);padding:.9rem 0;margin:1rem 0}
canvas.sig{display:block;width:100%;height:200px;background:#fff;border:1.5px solid var(--trait);border-radius:4px;touch-action:none;cursor:crosshair}
.coche{display:flex;gap:.75rem;align-items:flex-start;margin:1rem 0}
.coche input{width:1.5rem;height:1.5rem;flex:none;margin-top:.1rem;accent-color:var(--sceau)}
dl.recap{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:.35rem 1.25rem;margin:1rem 0}
dl.recap dt{color:var(--doux)} dl.recap dd{margin:0;overflow-wrap:anywhere}
.tampon{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:4px;padding:.35rem .8rem;font-weight:600;transform:rotate(-2deg);margin-bottom:1rem}
/* admin */
nav.onglets{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1px solid var(--trait);margin-bottom:1.25rem}
nav.onglets button{background:none;border:0;border-bottom:3px solid transparent;padding:.8rem 1rem;min-height:48px;cursor:pointer;white-space:nowrap;color:var(--doux)}
nav.onglets button[aria-pressed="true"]{border-color:var(--sceau);color:var(--encre);font-weight:600}
.defile{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--trait);white-space:nowrap}
th{color:var(--doux);font-weight:500}
.etat{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.82rem;background:var(--ok-fond);color:var(--ok)}
.etat.off{background:var(--champ);color:var(--doux)}
.ligne{display:grid;grid-template-columns:1fr 150px auto auto;gap:.5rem;align-items:center;margin-bottom:.5rem}
.ligne label{display:flex;gap:.35rem;align-items:center;font-size:.9rem}
.clause{border:1px solid var(--trait);border-radius:4px;padding:.75rem;margin-bottom:.75rem}
.adm textarea{min-height:90px;font-family:var(--serif)}
.barres div{display:grid;grid-template-columns:minmax(110px,180px) 1fr 2.5rem;gap:.6rem;align-items:center;margin:.35rem 0;font-size:.93rem}
.barres i{display:block;height:14px;background:var(--sceau);border-radius:2px;min-width:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem 2.5rem}
textarea.csv{width:100%;min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:var(--champ);border:1px solid var(--trait);border-radius:4px;padding:.6rem;white-space:pre}
@media (max-width:760px){
  .client{grid-template-columns:1fr}
  ol.etapes{position:static;display:flex;gap:.4rem;overflow-x:auto}
  ol.etapes li span{display:none} ol.etapes li.ici span{display:inline}
  .ligne{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:no-preference){.feuille{transition:border-color .2s}}
</style>

["Interventions de tiers mandatés par NCA",`Sous réserve de l'approbation préalable du Client, NCA pourra mandater des experts ou d'autres tiers pour le compte du Client et dans le cadre de la Mission. Dans ce cas, ces experts ou tiers seront seuls responsables de l'exécution de leurs services, et la responsabilité de NCA ne saura être recherchée Cela s'applique également si les services rendus par ce tiers sont facturés au Client par NCA.`],
["Conflit d'intérêt",`NCA confirme qu'à sa connaissance, aucun conflit d'intérêts ne l'empêche d'agir en tant que représentant légal du Client.

["Communications",`NCA peut communiquer avec le Client et d'autres conseillers en recourant au courrier électronique et à d'autres moyens de communication, qui seront déterminants et seront considérés comme des preuves suffisantes dans le cadre des relations entre le Client et NCA.

["Confidentialité",`En tant que cabinet d'avocats luxembourgeois, les avocats et conseillers de NCA sont soumis, en vertu des lois luxembourgeoises et des règles établies par l'Ordre des avocats du Luxembourg, à des obligations de confidentialité et de secret professionnel.

En ce qui concerne la communication ou la divulgation d'informations au Représentant du Client, les clauses 3, 5 et 8 de la présente lettre d'engagement s'appliquent.`],
["Résiliation",`Sous réserve des dispositions de l'article 4, le Client peut à tout moment mettre fin à la Mission par écrit.
NCA peut mettre fin à la Mission par notification écrite avec un délai de préavis raisonnable, sauf s'il existe des motifs sérieux justifiant une résiliation immédiate ou s'il en a été expressément convenu ainsi dans le cadre du présent accord.
Le Client convient que, entre autres, le non-paiement des factures ou des acomptes de NCA conformément aux présentes conditions générales ou la conduite d'activités par le Client (ou toute autre partie liée) d'une façon inacceptable, d'une façon générant pour le Client et/ou NCA un risque d'image négative, de mauvaise presse ou de déconsidération par les autorités publiques ou privées, de mauvaise foi, ou dans des circonstances illégales, frauduleuses ou sanctionnées pénalement, constitueraient des motifs graves justifiant une résiliation immédiate.`],
["Archivage des documents",`NCA conservera le dossier relatif au Conseil (à l'exception des éléments qui seront renvoyés au Client ou transmis à d'autres personnes au nom du Client) pendant un délai maximum de dix ans après la fin du travail de NCA sur les Opérations. NCA a le droit de détruire le dossier à tout moment après l'expiration de cette période, sauf s'il en a été expressément convenu autrement.`],
["Obligations relatives à la connaissance du Client",`Afin d'être en mesure d'effectuer une vérification préalable de la "connaissance du client", NCA aura besoin de certaines informations sur le Client et des autres parties aux Opérations ainsi que sur l'origine des fonds en relation avec les Opérations, comme cela peut être requis par la loi applicable, notamment en ce qui concerne la lutte contre le blanchiment d'argent et la lutte contre le financement du terrorisme.

["Décisions commerciales",`NCA agit uniquement en tant que conseiller juridique du Client en ce qui concerne les Opérations.

["Responsabilité",`Sauf en cas de faute intentionnelle ou de négligence grave, la responsabilité globale de NCA pour tous les cas de responsabilité possibles résultant de la Mission ou en rapport avec la Mission sera limitée à la couverture fournie prévue par l'assurance fournie par le barreau de Luxembourg en rapport avec la Mission. Si cette assurance ne fournit pas de couverture, et sauf en cas de faute intentionnelle ou de négligence grave, la responsabilité globale de NCA pour tous les cas éventuels de responsabilité résultant de ou en rapport avec cette Mission sera limitée au montant des honoraires facturés par NCA au titre du temps passé et acquittés (c'est-à-dire ne comprenant pas les honoraires complémentaires de résultat). Le Client renonce à toute action en responsabilité à l'égard de NCA en relation avec les services / conseils rendus par NCA au Client qui ont été rendus plus de 12 mois avant que cette action en responsabilité ne soit initiée. Une couverture supplémentaire peut être mise en place sur demande. Dans ce cas, NCA facturera des frais supplémentaires pour couvrir la couverture d'assurance supplémentaire demandée par le Client.
En ce qui concerne les procédures publiques, administratives ou précontentieuses, toute responsabilité de NCA est notamment exclue lorsque les délais ou les formalités n'ont pas pu être respectés en raison de la négligence ou de la conduite délibérée du Client, ou lorsque les informations ou les documents demandés par NCA et pertinents pour ladite procédure n'ont pas du tout été communiqués par le Client, ou l'ont été avec un retard déraisonnable ou pas au moment demandé par NCA.
NCA n'est pas responsable envers le Client ou tout autre tiers des actes d'experts ou d'autres tiers intervenants tels que les banques ou l'administration publique, ni des dommages résultant de la planification, de la coordination, du suivi ou de la gestion de l'Opération dans lesquelles ou laquelle elle n'intervient pas.
Le Client convient que le produit du travail fourni par NCA est exclusivement destiné au Client et non à des tiers. Par conséquent, le Client ne peut communiquer à des tiers les déclarations faites par NCA qu'après avoir obtenu l'accord écrit préalable de NCA.`],
["Règlement général sur la protection des données",`NCA, agissant en tant que contrôleur de données, recueille des données afin de fonctionner efficacement et de vous fournir (toute personne concernée en relation avec NCA) les meilleurs services. Chez NCA, la protection de votre vie privée est une priorité. La présente politique de confidentialité a été conçue pour traiter de la manière dont NCA peut collecter, utiliser, partager, protéger et conserver des informations vous concernant, ainsi que des droits auxquels vous avez droit.
Les informations personnelles du Client seront utilisées exclusivement dans le cadre de la demande sa demande et de la Mission qui en découle.
En tant que responsable de traitement, NCA traite les données personnelles pour des besoins administratifs et de suivi de l'affaire.
Dans les conditions définies par la loi Informatique et libertés et le règlement européen sur la protection des données, le Client a un droit d'accès aux données le concernant, de rectification, de limitation, de portabilité, d'effacement.
Le Client dispose également un droit de s'opposer à tout moment, pour des raisons tenant à sa situation particulière, à un traitement des données à caractère personnel ayant comme base juridique l'intérêt légitime du Cabinet, ainsi que d'un droit d'opposition à la prospection commerciale.
Le Client dispose également du droit de définir des directives générales et particulières définissant la manière dont il entend que soit exercées, après son décès, les droits mentionnés ci-dessus par courrier électronique à l'adresse suivante : nadia.chouhad@ncadvocat.lu ou par courrier postal accompagné d'une copie d'un titre d'identité signé à l'adresse suivante : NC ADVOCAT S.à r.l., 2A, rue de la Paix, L-2312 Luxembourg.
Enfin, le Client a le droit d'introduire une réclamation auprès de la Commission Nationale pour la Protection des Données.`,RGPD],
["Destinataire unique",`Le produit du travail fourni par NCA est destiné uniquement au Client (y compris le Représentant du Client) pour son usage exclusif et ne peut être utilisé par aucune autre personne ou entité ou à aucune autre fin, ni être rendu public, fourni ou distribué, ni son contenu communiqué, dans un document, une déclaration ou une autre communication, à un tiers sans l'accord écrit préalable de NCA. De même, le devoir de diligence de NCA est au seul bénéfice du Client et aucun tiers ne pourra s'en prévaloir.
NCA s'engage à garder confidentielle toute information échangée dans le cadre de l'exécution du présent contrat. NCA s'engage à prendre les mesures nécessaires à l'égard de son personnel, de ses sous-traitants et de ses fournisseurs pour assurer, sous leur responsabilité, cette confidentialité.`],
["Droit applicable et juridiction",`La présente lettre d'engagement (ainsi que tous les droits et obligations contractuels ou non contractuels qui y sont liés) est soumise au droit du Grand-Duché de Luxembourg et doit être interprétée conformément à ce droit. Les tribunaux du Luxembourg ont une compétence exclusive pour tout litige découlant de la présente Mission ou en rapport avec elle. Toutefois, avant tout litige devant les tribunaux susmentionnés, NCA et/ou le Client porteront le litige devant le Centre de Médiation Civile et Commerciale de Luxembourg de la manière la plus appropriée par la partie la plus diligente. Les deux parties s'engagent à accepter et à respecter le règlement de médiation applicable.
Si le Client est d'accord avec le contenu de la présente lettre d'engagement, il lui est demandé de bien vouloir la signer électroniquement en confirmation de son accord avec les conditions énoncées ci-dessus.

  signer();
  const n=d.getNumberOfPages();
  for(let i=1;i<=n;i++){d.setPage(i);d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(120);d.text(pdfTxt(`${c.nom} - ${m.doc} - ${f.ref}`),L,288);d.text(`${i}/${n}`,R,288,{align:"right"})}
  return d.output("blob");
}
async function telecharger(nom,data){
  if(window.claude){const dl=await window.claude.use("downloads");if(!dl)throw{code:"unavailable"};await dl.save({filename:nom,data});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=nom;document.body.append(a);a.click();a.remove();
}
async function telechargerPDF(ref){
  const dos=S.dos.find(x=>x.ref===ref);
  if(!dos||!dos.pdf)return erreur("Le PDF de ce dossier n'a pas pu être généré. Rechargez la page puis recommencez la signature.");
  try{await telecharger(`NC-Advocat-${ref}.pdf`,dos.pdf)}
  catch(e){if(e&&e.code==="declined")return;erreur(e&&e.code==="rate_limited"?"Un téléchargement est déjà en attente de confirmation. Validez-le puis recommencez.":"Le téléchargement n'est pas disponible dans cette vue.")}
}
function erreur(msg){const e=document.getElementById("err");e.innerHTML=`<div class="alerte" role="alert">${msg}</div>`;e.scrollIntoView({block:"center",behavior:"smooth"})}
function suite(){
  const m=mod(C.mod);
  if(C.etape===0){if(!C.cab)return erreur("Choisissez le cabinet qui suit votre dossier.");if(!m||m.cab!==C.cab)return erreur("Indiquez si vous consultez en tant que particulier ou professionnel.")}
  if(C.etape===1){
    let manque=[];document.querySelectorAll(".ch.err").forEach(n=>n.classList.remove("err"));
    m.champs.forEach(f=>{if(f.type==="titre"||(estFact(f)&&!C.factDiff))return;const v=(C.vals[f.id]||"").trim();
      if((f.requis&&!v)||(v&&f.type==="email"&&!/^\S+@\S+\.\S+$/.test(v))){manque.push(f.label);document.querySelector(`[data-ch="${f.id}"]`)?.classList.add("err")}});
    const pm=m.pieces.filter(p=>p.requis&&!C.fichiers[p.id]).map(p=>p.label);
    if(pm.length||manque.length)return erreur((pm.length?"Pièces manquantes : "+pm.map(esc).join(", ")+". ":"")+(manque.length?"À compléter ou corriger : "+manque.map(esc).join(", ")+".":""));
  }
  if(C.etape===3){
    if(!C.sig)return erreur("Signez dans le cadre avant d'envoyer.");
    if(!m.acceptations.every((_,i)=>C.acc[i]))return erreur("Cochez les cases d'acceptation avant d'envoyer.");
    const d=new Date(),p=n=>String(n).padStart(2,"0");
    const pre=m.cab==="lux"?"LUX":"MTZ",n=S.dos.filter(x=>x.cab===m.cab).length+1;
    C.fin={ref:`${pre}-${d.getFullYear()}-${String(n).padStart(4,"0")}`,date:`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,cab:m.cab,type:m.type,client:nomClient(),typeDossier:C.vals.typeDossier||"Non renseigné",origine:C.vals.origine||"Non renseigné",email:C.vals.email||"",pieces:Object.keys(C.fichiers).length};
    try{C.fin.pdf=construirePDF()}catch(e){C.fin.pdf=null;console.error(e)}
    S.dos.unshift(C.fin);return rendre();
  }
  C.etape++;rendre();
}

/* ---------- Administration ---------- */
function vueAdmin(){
  const o=[["modeles","Modèles de formulaires"],["editeur","Modifier un formulaire"],["cabinets","Coordonnées"],["dossiers","Dossiers reçus"],["stats","Statistiques"]];
  return `<section class="feuille adm"><h1>Administration</h1>
  <nav class="onglets">${o.map(([k,l])=>`<button data-act="onglet" data-v="${k}" aria-pressed="${adm.onglet===k}">${l}</button>`).join("")}</nav>
  ${({modeles:aModeles,editeur:aEditeur,cabinets:aCabinets,dossiers:aDossiers,stats:aStats})[adm.onglet]()}</section>`;
}
const cabNom=k=>k==="lux"?"Luxembourg":"Metz";
function aModeles(){
  return `<p class="intro">Chaque modèle a ses propres champs, pièces et clauses. Dupliquez-en un pour créer un formulaire KYC, une lettre d'engagement ou un formulaire de contact.</p>
  <div class="defile"><table><thead><tr><th>Modèle</th><th>Cabinet</th><th>Clientèle</th><th>Champs</th><th>Pièces</th><th>État</th><th></th></tr></thead><tbody>
  ${S.mods.map(m=>`<tr><td><strong>${esc(m.nom)}</strong></td><td>${cabNom(m.cab)}</td><td>${m.type}</td><td>${m.champs.length}</td><td>${m.pieces.length}</td><td><span class="etat ${m.actif?"":"off"}">${m.actif?"En ligne":"Désactivé"}</span></td>
  <td><button class="btn petit" data-act="editer" data-v="${m.id}">Modifier</button> <button class="btn petit" data-act="dupliquer" data-v="${m.id}">Dupliquer</button> <button class="btn petit" data-act="activer" data-v="${m.id}">${m.actif?"Désactiver":"Activer"}</button></td></tr>`).join("")}
  </tbody></table></div>`;
}
function aEditeur(){
  const m=mod(adm.mod)||S.mods[0];adm.mod=m.id;
  const types=[["text","Texte"],["email","E-mail"],["tel","Téléphone"],["date","Date"],["select","Liste de choix"],["textarea","Texte long"],["titre","Titre de section"]];
  return `<label class="ch" style="max-width:420px">Formulaire à modifier<select data-adm="choixMod">${S.mods.map(x=>`<option value="${x.id}" ${x.id===m.id?"selected":""}>${esc(x.nom)} – ${cabNom(x.cab)} (${x.type})</option>`).join("")}</select></label>
  <h2>Général</h2><div class="grille">
   <label class="ch">Nom affiché au client<input type="text" data-adm="mod" data-p="nom" value="${esc(m.nom)}"></label>
   <label class="ch">Cabinet<select data-adm="mod" data-p="cab"><option value="lux" ${m.cab==="lux"?"selected":""}>Luxembourg</option><option value="metz" ${m.cab==="metz"?"selected":""}>Metz</option></select></label>
   <label class="ch">Clientèle<select data-adm="mod" data-p="type"><option ${m.type==="B2C"?"selected":""}>B2C</option><option ${m.type==="B2B"?"selected":""}>B2B</option></select></label></div>
  <h2>Honoraires, équipe et banque</h2><div class="grille">
   ${[["taux","Taux horaire (EUR HT)"],["bureau","Frais de bureau (EUR HT)"],["conformite","Frais de conformité (EUR HT)"],["provision","Provision à l'ouverture (EUR HT)"],["tva","TVA (%)"]].map(([p,l])=>`<label class="ch">${l}<input type="text" data-adm="param" data-p="${p}" value="${esc(m.params[p])}"></label>`).join("")}
   <label class="ch large">Avocats en charge (un par ligne)<textarea data-adm="param" data-p="avocats">${esc(m.params.avocats)}</textarea></label>
   <label class="ch large">Coordonnées bancaires<textarea data-adm="param" data-p="banque">${esc(m.params.banque)}</textarea></label>
   <label class="ch large">Texte d'introduction<textarea data-adm="mod" data-p="intro">${esc(m.intro)}</textarea></label></div>
  <h2>Champs du formulaire</h2>
  ${m.champs.map((f,i)=>`<div class="ligne"><input type="text" aria-label="Intitulé" data-adm="champ" data-i="${i}" data-p="label" value="${esc(f.label)}">
   <select aria-label="Type" data-adm="champ" data-i="${i}" data-p="type">${types.map(([k,l])=>`<option value="${k}" ${f.type===k?"selected":""}>${l}</option>`).join("")}</select>
   <label><input type="checkbox" data-adm="champ" data-i="${i}" data-p="requis" ${f.requis?"checked":""}> Obligatoire</label>
   <button class="btn petit" data-act="supChamp" data-v="${i}">Supprimer</button>
   ${f.type==="select"?`<input type="text" style="grid-column:1/-1" aria-label="Choix, séparés par des virgules" placeholder="Choix, séparés par des virgules" data-adm="champ" data-i="${i}" data-p="options" value="${esc(f.options)}">`:""}</div>`).join("")}
  <button class="btn petit" data-act="addChamp">Ajouter un champ</button>
  <h2>Pièces à joindre</h2>
  ${m.pieces.map((p,i)=>`<div class="ligne"><input type="text" aria-label="Pièce" data-adm="piece" data-i="${i}" data-p="label" value="${esc(p.label)}"><span></span>
   <label><input type="checkbox" data-adm="piece" data-i="${i}" data-p="requis" ${p.requis?"checked":""}> Obligatoire</label><button class="btn petit" data-act="supPiece" data-v="${i}">Supprimer</button></div>`).join("")}
  <button class="btn petit" data-act="addPiece">Ajouter une pièce</button>
  <h2>Articles du document</h2><p class="note" style="margin-bottom:1rem">Variables reprises automatiquement dans le texte : {{client}}, {{adresse_client}}, {{email}}, {{tel}}, {{representant}}, {{mission}}, {{taux}}, {{frais_bureau}}, {{frais_conformite}}, {{provision}}, {{tva}}, {{avocats}}, {{banque}}.</p>
  ${m.clauses.map((k,i)=>`<div class="clause"><div class="ligne" style="grid-template-columns:1fr auto"><input type="text" aria-label="Titre de l'article ${i+1}" data-adm="clause" data-i="${i}" data-p="titre" value="${esc(k.titre)}"><button class="btn petit" data-act="supClause" data-v="${i}">Supprimer</button></div>
   <textarea aria-label="Texte de l'article ${i+1}" data-adm="clause" data-i="${i}" data-p="texte">${esc(k.texte)}</textarea></div>`).join("")}
  <button class="btn petit" data-act="addClause">Ajouter une clause</button>
  <p class="note" style="margin-top:1.5rem">Les modifications s'appliquent tout de suite : repassez en « Vue client » pour les voir.</p>`;
}
function aCabinets(){
  return Object.entries(S.cab).map(([k,c])=>`<h2>${cabNom(k)}</h2><div class="grille">
   ${[["nom","Nom du cabinet"],["adresse","Adresse"],["tel","Téléphone"],["email","E-mail de réception des dossiers"]].map(([p,l])=>`<label class="ch">${l}<input type="text" data-adm="cab" data-i="${k}" data-p="${p}" value="${esc(c[p])}"></label>`).join("")}</div>`).join("");
}
function csv(){
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  return ["Référence;Date de signature;Cabinet;Clientèle;Client;E-mail;Type de dossier;Origine;Pièces"].concat(S.dos.map(d=>[d.ref,d.date,cabNom(d.cab),d.type,d.client,d.email,d.typeDossier,d.origine,d.pieces].map(q).join(";"))).join("\n");
}
function aDossiers(){
  return `<div id="err"></div>${S.dos.length?`<p><button class="btn petit" data-act="csv">Exporter en CSV (Excel)</button></p>
  ${adm.csv?`<textarea class="csv" id="csv" readonly>${esc(csv())}</textarea><p><button class="btn petit" data-act="copier">Copier</button></p>`:""}
  <div class="defile"><table><thead><tr><th>Référence</th><th>Signée le</th><th>Cabinet</th><th>Clientèle</th><th>Client</th><th>Type de dossier</th><th>Origine</th><th>Pièces</th><th></th></tr></thead><tbody>
  ${S.dos.map(d=>`<tr><td><strong>${d.ref}</strong></td><td>${d.date}</td><td>${cabNom(d.cab)}</td><td>${d.type}</td><td>${esc(d.client)}</td><td>${esc(d.typeDossier)}</td><td>${esc(d.origine)}</td><td>${d.pieces}</td><td><button class="btn petit" data-act="pdf" data-v="${d.ref}">PDF signé</button></td></tr>`).join("")}</tbody></table></div>`
  :`<p class="note">Aucun dossier pour l'instant. Les dossiers signés depuis « Vue client » apparaissent ici, avec leur PDF.</p>`}`;
}
function aStats(){
  if(!S.dos.length)return `<p class="note">Les statistiques apparaissent dès le premier dossier signé.</p>`;
  const bloc=(titre,cle)=>{const n={};S.dos.forEach(d=>{const v=cle(d);n[v]=(n[v]||0)+1});const max=Math.max(...Object.values(n),1);
    return `<div><h2>${titre}</h2><div class="barres">${Object.entries(n).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><span>${esc(k)}</span><i style="width:${v/max*100}%"></i><b>${v}</b></div>`).join("")}</div></div>`};
  return `<p class="intro">${S.dos.length} dossiers ouverts via le formulaire.</p><div class="stats">${bloc("Clientèle",d=>d.type==="B2B"?"Professionnels (B2B)":"Particuliers (B2C)")}${bloc("Cabinet",d=>cabNom(d.cab))}${bloc("Type de dossier",d=>d.typeDossier)}${bloc("Origine des clients",d=>d.origine)}</div>`;
}

/* ---------- Événements ---------- */
const ACT={
  vue:b=>{vue=b.dataset.v;rendre()},
  cab:b=>{C.cab=b.dataset.v;C.mod=null;rendre()},
  mod:b=>{if(C.mod!==b.dataset.v){C.mod=b.dataset.v;C.vals={};C.fichiers={};C.blobs={};C.auto={};C.lectureMsg=""}rendre()},
  lire:()=>lire(),
  suite,retour:()=>{C.etape--;rendre()},
  effacer:()=>brancherSignature(),
  recommencer:()=>{C=neuf();rendre()},
  voirAdmin:()=>{C=neuf();vue="admin";adm.onglet="dossiers";rendre()},
  onglet:b=>{adm.onglet=b.dataset.v;rendre()},
  editer:b=>{adm.mod=b.dataset.v;adm.onglet="editeur";rendre()},
  dupliquer:b=>{const c=JSON.parse(JSON.stringify(mod(b.dataset.v)));c.id=uid();c.nom+=" (copie)";c.actif=false;S.mods.push(c);rendre()},
  activer:b=>{const m=mod(b.dataset.v);m.actif=!m.actif;rendre()},
  addChamp:()=>{mod(adm.mod).champs.push(F(uid(),"Nouveau champ","text",false));rendre()},
  supChamp:b=>{mod(adm.mod).champs.splice(+b.dataset.v,1);rendre()},
  addPiece:()=>{mod(adm.mod).pieces.push(P("Nouvelle pièce"));rendre()},
  supPiece:b=>{mod(adm.mod).pieces.splice(+b.dataset.v,1);rendre()},
  addClause:()=>{mod(adm.mod).clauses.push({id:uid(),titre:"Nouvelle clause",texte:""});rendre()},
  supClause:b=>{mod(adm.mod).clauses.splice(+b.dataset.v,1);rendre()},
  csv:async()=>{try{await telecharger("dossiers-nc-advocat.csv","\ufeff"+csv())}catch(e){if(e&&e.code==="declined")return;adm.csv=true;rendre(true)}},
  pdf:b=>telechargerPDF(b.dataset.v),
  copier:b=>{const t=document.getElementById("csv");t.select();try{navigator.clipboard.writeText(t.value).catch(()=>document.execCommand("copy"))}catch(e){try{document.execCommand("copy")}catch(_){}}b.textContent="Copié"}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b)});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.f){C.vals[t.dataset.f]=t.value;if(C.auto[t.dataset.f]){delete C.auto[t.dataset.f];const l=t.closest(".ch");l?.classList.remove("auto");l?.querySelector("small")?.remove()}}if(t.dataset.acc)C.acc[t.dataset.acc]=t.checked});
document.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.adm;
  if(t.dataset.fact!==undefined){C.factDiff=t.checked;rendre(true);return}
  if(t.dataset.piece){if(t.files[0]){C.fichiers[t.dataset.piece]=t.files[0].name;C.blobs[t.dataset.piece]=t.files[0];rendre(true)}return}
  if(!a)return;
  const val=t.type==="checkbox"?t.checked:t.value,m=mod(adm.mod);
  if(a==="choixMod"){adm.mod=val;return rendre()}
  if(a==="mod"){m[t.dataset.p]=val;return}
  if(a==="param"){m.params[t.dataset.p]=val;return}
  if(a==="cab"){S.cab[t.dataset.i][t.dataset.p]=val;return}
  const liste={champ:m.champs,piece:m.pieces,clause:m.clauses}[a];
  liste[+t.dataset.i][t.dataset.p]=val;
  if(a==="champ"&&t.dataset.p==="type")rendre();
});
rendre();
</script>
